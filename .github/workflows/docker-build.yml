name: Docker Build and Publish

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the upstream images and release are unchanged
        type: boolean
        default: false
  schedule:
    - cron: '17 3 * * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve latest SPNEGO release
        id: spnego
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release=$(gh api repos/stnoonan/spnego-http-auth-nginx-module/releases/latest --jq .tag_name)
          commit=$(gh api "repos/stnoonan/spnego-http-auth-nginx-module/commits/$release" --jq .sha)
          echo "Building SPNEGO $release ($commit)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Compute Docker Hub image name (lowercase)
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          set -euo pipefail
          # Lowercase Docker Hub username and repo name
          uname_lc=$(printf "%s" "$DOCKER_USERNAME" | tr '[:upper:]' '[:lower:]')
          repo_name=${GITHUB_REPOSITORY#*/}
          repo_lc=$(printf "%s" "$repo_name" | tr '[:upper:]' '[:lower:]')
          echo "DOCKERHUB_IMAGE=${uname_lc}/${repo_lc}" >> "$GITHUB_ENV"

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check upstream and published images
        id: decision
        env:
          GHCR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DOCKERHUB_IMAGE: docker.io/${{ env.DOCKERHUB_IMAGE }}
          SPNEGO_COMMIT: ${{ steps.spnego.outputs.commit }}
          FORCE_BUILD: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail
          image_digest() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' 2>/dev/null | jq -er '.digest' || true
          }

          NGINX_DIGEST=$(docker buildx imagetools inspect nginx:stable-alpine --format '{{json .Manifest}}' | jq -er '.digest')
          GHCR_LATEST_DIGEST=$(image_digest "$GHCR_IMAGE:latest")
          DOCKERHUB_LATEST_DIGEST=$(image_digest "$DOCKERHUB_IMAGE:latest")
          GHCR_STABLE_DIGEST=$(image_digest "$GHCR_IMAGE:stable")
          DOCKERHUB_STABLE_DIGEST=$(image_digest "$DOCKERHUB_IMAGE:stable")
          PUBLISHED_NGINX_DIGEST=
          PUBLISHED_SPNEGO_COMMIT=
          if [[ -n "$GHCR_LATEST_DIGEST" && -n "$DOCKERHUB_LATEST_DIGEST" ]]; then
            docker pull --platform linux/amd64 "$GHCR_IMAGE:latest"
            PUBLISHED_NGINX_DIGEST=$(docker image inspect "$GHCR_IMAGE:latest" --format '{{index .Config.Labels "org.cygnusnetworks.nginx-base-digest"}}')
            PUBLISHED_SPNEGO_COMMIT=$(docker image inspect "$GHCR_IMAGE:latest" --format '{{index .Config.Labels "org.cygnusnetworks.spnego-source-revision"}}')
          fi

          echo "nginx_digest=$NGINX_DIGEST" >> "$GITHUB_OUTPUT"
          export NGINX_DIGEST GHCR_LATEST_DIGEST DOCKERHUB_LATEST_DIGEST GHCR_STABLE_DIGEST DOCKERHUB_STABLE_DIGEST
          export PUBLISHED_NGINX_DIGEST PUBLISHED_SPNEGO_COMMIT
          bash scripts/check-publish.sh
          echo "NGINX base: $NGINX_DIGEST; SPNEGO: $SPNEGO_COMMIT"

      - name: Extract metadata (tags, labels) for Docker
        if: steps.decision.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            docker.io/${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=stable

      - name: Build and push Docker image
        if: steps.decision.outputs.build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NGINX_IMAGE=nginx:stable-alpine@${{ steps.decision.outputs.nginx_digest }}
            NGINX_BASE_DIGEST=${{ steps.decision.outputs.nginx_digest }}
            SPNEGO_COMMIT=${{ steps.spnego.outputs.commit }}

      - name: Add missing GHCR stable tag without rebuilding
        if: steps.decision.outputs.retag_ghcr == 'true'
        run: docker buildx imagetools create --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:stable" "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

      - name: Add missing Docker Hub stable tag without rebuilding
        if: steps.decision.outputs.retag_dockerhub == 'true'
        run: docker buildx imagetools create --tag "docker.io/${{ env.DOCKERHUB_IMAGE }}:stable" "docker.io/${{ env.DOCKERHUB_IMAGE }}:latest"

  keep-schedule-active:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Keep the schedule active in a quiet repository
        run: |
          set -euo pipefail
          git fetch origin main
          last_commit=$(git log -1 --format=%ct origin/main)
          now=$(date -u +%s)
          if (( now - last_commit < 45 * 86400 )); then
            exit 0
          fi

          git switch -C main origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m 'Keep scheduled image builds active'
          git push origin HEAD:main
