name: Docker Build and Publish

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract nginx version from module image
        id: nginx-version
        run: |
          set -euo pipefail
          # Create a temporary container from the module image and extract package info
          container_id=$(docker create chocolatefrappe/nginx-modules:stable-alpine-auth-spnego sh -c 'exit 0')
          docker cp "$container_id:/packages" /tmp/nginx-modules-packages
          docker rm "$container_id"

          # Extract version from package filename (e.g., nginx-module-auth-spnego-1.28.0.1.1.2-r1.apk -> 1.28.0)
          pkg_file=$(find /tmp/nginx-modules-packages -maxdepth 1 -type f -name 'nginx-module-auth-spnego-[0-9]*.apk' -print -quit)
          test -n "$pkg_file"
          pkg_name=$(basename "$pkg_file")
          # Extract the nginx version (first 3 version components: X.Y.Z)
          nginx_version=$(echo "$pkg_name" | sed -E 's/nginx-module-auth-spnego-([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "Detected nginx version: $nginx_version"
          echo "version=${nginx_version}" >> "$GITHUB_OUTPUT"

      - name: Compute Docker Hub image name (lowercase)
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          set -euo pipefail
          # Lowercase Docker Hub username and repo name
          uname_lc=$(printf "%s" "$DOCKER_USERNAME" | tr '[:upper:]' '[:lower:]')
          repo_name=${GITHUB_REPOSITORY#*/}
          repo_lc=$(printf "%s" "$repo_name" | tr '[:upper:]' '[:lower:]')
          echo "DOCKERHUB_IMAGE=${uname_lc}/${repo_lc}" >> "$GITHUB_ENV"

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            docker.io/${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NGINX_VERSION=${{ steps.nginx-version.outputs.version }}-alpine

  keep-schedule-active:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Keep the schedule active in a quiet repository
        run: |
          set -euo pipefail
          git fetch origin main
          last_commit=$(git log -1 --format=%ct origin/main)
          now=$(date -u +%s)
          if (( now - last_commit < 45 * 86400 )); then
            exit 0
          fi

          git switch -C main origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m 'Keep scheduled image builds active'
          git push origin HEAD:main
